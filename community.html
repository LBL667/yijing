<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAFBFD">
  <title>时尚穿搭社区</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- 顶部吸底区：状态栏 + 搜索栏 -->
    <div class="top-sticky" id="topSticky">

      <!-- 搜索栏 -->
      <div class="search-row">
        <label class="search-box">
          <svg class="search-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <circle cx="9" cy="9" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13.8 13.8 18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索你想看的穿搭 / 身材 / 场景"
                 autocomplete="off" enterkeyhint="search" aria-label="搜索穿搭内容">
        </label>
      </div>
    </div>

    <!-- 身材筛选（数据来自 API 层） -->
    <nav class="pill-row" id="pillRow" aria-label="按身材筛选"></nav>

    <!-- 场景筛选（数据来自 API 层） -->
    <nav class="scene-row" id="sceneRow" aria-label="按场景筛选"></nav>

    <!-- 内容双列流 -->
    <main class="feed">
      <div class="feed-col" id="colLeft"></div>
      <div class="feed-col" id="colRight"></div>
    </main>

    <!-- 空状态 -->
    <div class="empty" id="emptyState" hidden>
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <circle cx="28" cy="28" r="16" fill="none" stroke="#D8DAE0" stroke-width="3"/>
        <path d="M40 40 52 52" stroke="#D8DAE0" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 28h12M28 22v12" stroke="#D8DAE0" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <p class="empty-title">没有找到相关内容</p>
      <p class="empty-sub">换个筛选条件或关键词试试</p>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="tab-bar" id="tabBar" aria-label="底部导航">
    <button class="tab is-active" data-tab="社区">
      <svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M4 10.4 12 4l8 6.4V19a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 19Z" fill="currentColor"/>
        <circle cx="12" cy="13.6" r="2" fill="#fff"/>
      </svg>
      <span>社区</span>
    </button>
    <button class="tab" data-tab="AI助手">
      <svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M12 4.4c-4.6 0-8 3-8 6.9 0 2.2 1.1 4.1 2.9 5.4l-.5 3.6 3.8-2c.6.1 1.2.2 1.8.2 4.6 0 8-3 8-6.9s-3.4-7.2-8-7.2z"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="8.6" cy="11.4" r="1" fill="currentColor"/>
        <circle cx="12" cy="11.4" r="1" fill="currentColor"/>
        <circle cx="15.4" cy="11.4" r="1" fill="currentColor"/>
      </svg>
      <span>AI助手</span>
    </button>
    <button class="tab" data-tab="衣柜">
      <svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M14.5 7a2.5 2.5 0 1 0-5 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M12 7 3.9 12.8c-.9.7-.4 2.1.7 2.1h14.8c1.1 0 1.6-1.4.7-2.1z"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <span>衣柜</span>
    </button>
    <button class="tab" data-tab="我的">
      <svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="8.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M5 20c0-3.8 3.1-6.3 7-6.3s7 2.5 7 6.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>我的</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/common.js"></script>
  <script src="js/api/client.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
